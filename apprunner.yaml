version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm run build
run:
  command: npm start
  network:
    port: 3001
  env:
    - name: PORT
      value: "3001"
    - name: NODE_ENV
      value: production
    - name: ENABLE_MOCK_CONTROLS
      value: "true"
    - name: MOCK_RANDOM_FAILURES
      value: "false"
